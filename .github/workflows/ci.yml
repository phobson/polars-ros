name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Makes tools/check_against_wqio.py and the matching pytest fail loudly if wqio
  # is unavailable, instead of skipping and reporting a green run that compared
  # nothing. The dev extra already installs it; this catches the case where that
  # install silently stopped happening.
  POLARS_ROS_REQUIRE_WQIO: "1"

jobs:
  # Cross-validate against the reference implementation. Kept as its own job
  # because it is the slowest check and the one most likely to need investigating,
  # so it should not be buried inside a matrix cell.
  cross-validate:
    name: Cross-validate against wqio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # maturin build writes the extension into the source tree; the tests and
      # checkers then exercise the compiled artifact, not an editable stub.
      - name: Build the extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m maturin develop --release

      - name: Run the test suite
        run: python -m pytest tests -v

      - name: Diff the transcribed fixtures against wqio's
        run: |
          python tools/check_fixtures.py
          python tools/check_expected_arrays.py

      - name: Compare every output array against wqio
        run: python tools/check_against_wqio.py --require -v

  # Run the suite against an actual built wheel on every supported platform.
  # This is the only job that would notice a wheel that builds but does not
  # import, or an abi3 tag that is wrong for one interpreter.
  wheels:
    name: wheel (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest
          python -m maturin build --release --out dist

      - name: Show what was built
        run: ls -l dist

      # Install the artifact, not the source tree, so a packaging mistake cannot
      # be masked by an editable install.
      - name: Install the wheel into a clean environment
        run: |
          python -m pip install --force-reinstall dist/*.whl

      - name: Test the installed wheel
        run: python -m pytest tests -v

  # Lints and formatting for the Rust side.
  rust-lints:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cargo test
        run: cargo test

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Confirms the long description and metadata actually render on PyPI, and that
  # the checkers still pass with no scientific stack installed at all. Neither is
  # covered by the jobs above.
  packaging:
    name: packaging + stdlib-only checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build an sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist

      - name: Install the sdist into a clean environment
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --upgrade pip
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz

      - name: Check no build artifacts leaked into the sdist
        run: |
          python - <<'PY'
          import tarfile, glob, sys
          path = glob.glob("dist/*.tar.gz")[0]
          names = [n.split("/", 1)[1] for n in tarfile.open(path).getnames() if "/" in n]
          bad = [
              n for n in names
              if n.endswith((".pdb", ".pyc", ".so", ".dylib", ".dll", ".pyd"))
              or "__pycache__" in n
              or n.split("/")[0] == "wqio"
          ]
          if bad:
              print("unexpected files in sdist:", *bad, sep="\n  ")
              sys.exit(1)
          print(f"ok: {len(names)} entries, no artifacts")
          PY

      - name: Run the stdlib-only checkers without the scientific stack
        # Deliberately no dev extra: the AST checkers must keep working with
        # nothing but the standard library, which is what makes them cheap
        # enough to run anywhere.
        run: |
          python tools/check_fixtures.py
          python tools/check_expected_arrays.py

  twine-check:
    name: metadata renders on PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin twine
          python -m maturin build --release --out dist

      - name: Check the wheel and sdist metadata
        run: python -m twine check --strict dist/*
