name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Makes tools/check_against_wqio.py and the matching pytest fail loudly if wqio
  # is unavailable, instead of skipping and reporting a green run that compared
  # nothing. The dev extra already installs it; this catches the case where that
  # install silently stopped happening.
  POLARS_ROS_REQUIRE_WQIO: "1"

jobs:
  # Cross-validate against the reference implementation. Kept as its own job
  # because it is the slowest check and the one most likely to need investigating,
  # so it should not be buried inside a matrix cell.
  cross-validate:
    name: Cross-validate against wqio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      # This job compiles polars once, but caching still keeps repeat runs to a
      # couple of minutes instead of six.
      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: pyproject.toml

      # --seed gives the venv pip, which the shared build-wheel action calls.
      # Exporting the venv puts it first on PATH for every later step.
      - name: Create the virtualenv
        run: |
          uv venv --seed
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Builds a wheel and installs that, rather than using `maturin develop`,
      # so the job exercises the same path users get from PyPI instead of
      # compiling the extension twice via `pip install .[dev]`.
      - name: Build and install the extension
        uses: ./.github/actions/build-wheel

      - name: Install the dev requirements
        # Bare requirements rather than `.[dev]`, which would also build and
        # install the source tree over the wheel this job is meant to test.
        run: |
          uv pip install --reinstall dist/*.whl
          python - <<'PY'
          import subprocess, tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as fh:
              extra = tomllib.load(fh)["project"]["optional-dependencies"]["dev"]
          subprocess.check_call(["uv", "pip", "install", *extra])
          PY

      - name: Run the test suite
        run: python -m pytest tests -v

      - name: Diff the transcribed fixtures against wqio's
        run: |
          python tools/check_fixtures.py
          python tools/check_expected_arrays.py

      - name: Compare every output array against wqio
        run: python tools/check_against_wqio.py --require -v

  # Run the suite against an actual built wheel on every supported platform.
  # This is the only job that would notice a wheel that builds but does not
  # import, or an abi3 tag that is wrong for one interpreter.
  wheels:
    name: wheel (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # This matrix spans Windows, where the default shell is PowerShell. The steps
    # below use bash constructs (`python - <<'PY'`, `ls -l`, `dist/*.whl` globs),
    # so pin bash everywhere instead of silently diverging per platform. Git Bash
    # ships with the Windows runners.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The ends of the supported range: 3.12 is the floor from
        # `requires-python`, 3.14 the newest we claim in the classifiers.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # Six matrix cells each compile polars from scratch otherwise (~7 min apiece).
      # Caching the registry and target directory keeps that to a few minutes after
      # the first run, and cuts the crates.io traffic a cold matrix generates.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheels-${{ matrix.os }}-${{ matrix.python }}

      # Every cargo invocation re-reads rust-toolchain.toml and will try to sync
      # the pinned toolchain, which needs network access. Doing that once here
      # means a sync failure is attributed to its own step instead of surfacing
      # as an unexplained "exit code 1" inside the wheel build.
      - name: Make sure the pinned toolchain is usable
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
          cache-dependency-glob: pyproject.toml

      # --seed gives the venv pip, which the shared build-wheel action calls.
      # Exporting the venv puts it first on PATH for every later step; the
      # bin/Scripts split covers Windows.
      - name: Create the virtualenv
        run: |
          uv venv --seed
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"

      - name: Build a wheel
        uses: ./.github/actions/build-wheel

      - name: Show what was built
        run: ls -l dist

      # Install the artifact, not the source tree, so a packaging mistake cannot
      # be masked by an editable install. The dev extra is installed as bare
      # requirements rather than as `.[dev]`, because that form would also build
      # and install the source tree -- defeating the whole point of this job.
      - name: Install the wheel into a clean environment
        run: |
          uv pip install --reinstall dist/*.whl
          python - <<'PY'
          import subprocess, tomllib
          from pathlib import Path

          # tomllib is in the standard library from 3.11, well below the 3.12
          # floor this project requires.
          with Path("pyproject.toml").open("rb") as fh:
              extra = tomllib.load(fh)["project"]["optional-dependencies"]["dev"]
          print("dev requirements:", *extra, sep="\n  ")
          subprocess.check_call(["uv", "pip", "install", *extra])
          PY

      - name: Confirm the tests import the wheel, not the source tree
        run: |
          python - <<'PY'
          import pathlib, polars_ros, sys

          where = pathlib.Path(polars_ros.__file__).resolve()
          print(f"importing polars_ros from {where}")
          if "site-packages" not in where.parts:
              sys.exit(f"expected the installed wheel, but got the source tree: {where}")
          PY

      - name: Test the installed wheel
        run: python -m pytest tests -v

  # Lints and formatting for the Rust side.
  rust-lints:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # `cargo test` links against libpython. PyO3 needs `extension-module` off to
      # find the symbols, and the resulting link step needs a shared libpython to
      # point at. python3-dev guarantees one is present and on the default linker
      # search path, so the job does not depend on how the runner's Python happens
      # to be built.
      - name: Install libpython for the test link step
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev

      - name: Run cargo test
        run: cargo test

      - name: Run cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Confirms the long description and metadata actually render on PyPI, and that
  # the checkers still pass with no scientific stack installed at all. Neither is
  # covered by the jobs above.
  packaging:
    name: packaging + stdlib-only checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: pyproject.toml

      - name: Build an sdist
        run: uv build --sdist

      - name: Install the sdist into a clean environment
        run: |
          uv venv /tmp/sdist-venv
          uv pip install --python /tmp/sdist-venv dist/*.tar.gz

      - name: Create the virtualenv for the checkers
        run: |
          uv venv
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check no build artifacts leaked into the sdist
        run: |
          python - <<'PY'
          import tarfile, glob, sys
          path = glob.glob("dist/*.tar.gz")[0]
          names = [n.split("/", 1)[1] for n in tarfile.open(path).getnames() if "/" in n]
          bad = [
              n for n in names
              if n.endswith((".pdb", ".pyc", ".so", ".dylib", ".dll", ".pyd"))
              or "__pycache__" in n
              or n.split("/")[0] == "wqio"
          ]
          if bad:
              print("unexpected files in sdist:", *bad, sep="\n  ")
              sys.exit(1)
          print(f"ok: {len(names)} entries, no artifacts")
          PY

      - name: Run the checkers without the scientific stack
        # Deliberately not the dev extra. check_expected_arrays needs nothing but
        # the standard library; check_fixtures additionally needs polars and
        # pytest, because it reads tests/conftest.py. wqio is installed with
        # --no-deps so the checkers can find its sources on disk without dragging
        # in numpy/pandas/scipy/probscale -- which is exactly the property this
        # job exists to prove, since importing wqio is never required.
        run: |
          uv pip install polars pytest
          uv pip install --no-deps "wqio>=0.7.2,<1.0"
          uv pip list
          python tools/check_expected_arrays.py
          python tools/check_fixtures.py

      - name: Confirm the checkers really did avoid the scientific stack
        # Guards against this job quietly becoming a no-op: if a future wqio
        # release starts importing numpy at build time, the install above would
        # pull it in, and the comparison would stop testing what it claims to.
        run: |
          python - <<'PY'
          import importlib.util, sys

          leaked = [n for n in ("numpy", "pandas", "scipy", "probscale")
                    if importlib.util.find_spec(n) is not None]
          if leaked:
              sys.exit(f"scientific stack leaked into the lean environment: {leaked}")
          print("ok: no numpy/pandas/scipy/probscale, so the checkers ran lean")
          PY

  twine-check:
    name: metadata renders on PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: pyproject.toml

      # --seed gives the venv pip, which the shared build-wheel action calls.
      # Exporting the venv puts it first on PATH for every later step.
      - name: Create the virtualenv
        run: |
          uv venv --seed
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          
      - name: Build a wheel
        uses: ./.github/actions/build-wheel
        with:
          extra-requirements: twine

      - name: Check the wheel and sdist metadata
        run: python -m twine check --strict dist/*

  release-path:
    name: release path (cibuildwheel)
    runs-on: ubuntu-latest
    # release.yml only runs when a tag is published, so nothing else in CI would
    # notice if it broke. This exercises the same machinery on the one platform
    # that needs no emulation: the aarch64, macOS and Windows cells stay
    # untested until the first real release.
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - uses: pypa/cibuildwheel@v4.3.0
        env:
          # Must match release.yml exactly, or this job stops testing what ships.
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS: "x86_64"
          CIBW_TEST_REQUIRES: "pytest"

      - name: Show what was built
        run: ls -l wheelhouse

      - name: Check the manylinux wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          python -m twine check --strict wheelhouse/*.whl
