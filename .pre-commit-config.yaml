repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uvx ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uvx ruff format
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uvx ty check --python .venv .
        language: system
        pass_filenames: false
        types: [python]
