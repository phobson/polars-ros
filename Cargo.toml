[package]
name = "polars_ros"
version = "0.1.0"
edition = "2021"
description = "Regression on Order Statistics and bootstrap confidence intervals for Polars"
license = "MIT"
repository = "https://github.com/phobson/polars-ros"
readme = "README.md"
keywords = ["polars", "hydrology", "censored-data", "statistics"]
categories = ["science"]

[lib]
name = "polars_ros"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `extension-module` is deliberately NOT enabled here. It tells PyO3 to leave
# the CPython symbols undefined, which is what a cdylib wants but what makes
# `cargo test` fail to link on ELF platforms (undefined symbol: Py_InitializeEx).
# maturin adds it via `features = ["pyo3/extension-module"]` in pyproject.toml, so
# builds still get a correct extension while tests and clippy link libpython.
# abi3-py311 means one wheel serves 3.11 and every later CPython, which is the
# same trick as abi3-py310 but with a floor matching `requires-python`.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-polars = { version = "0.28", features = ["derive", "dtype-struct"] }
serde = { version = "1", features = ["derive"] }
polars = { version = "0.55.1", features = ["dtype-struct"], default-features = false }
polars-arrow = { version = "0.55.1", default-features = false }
polars-mem-engine = { version = "0.55.1", features = ["python"] }
polars-core = { version = "0.55.1", default-features = false }
rand = "0.9"
rand_chacha = "0.9"
libm = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
