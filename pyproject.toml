[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-ros"
version = "0.1.0"
description = "Regression on Order Statistics and bootstrap confidence intervals for Polars"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["polars>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.maturin]
python-source = "python"
module-name = "polars_ros._internal"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]