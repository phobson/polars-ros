[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-ros"
version = "0.1.0"
description = "Regression on Order Statistics and bootstrap confidence intervals for Polars"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["polars>=1.0"]

[project.optional-dependencies]
# The scientific stack is needed only by the tools/ checkers, which cross-validate
# this port against the *installed* wqio. The regular test suite deliberately does
# not import wqio, so it stays installable without them.
#   numpy/pandas/scipy  wqio.ros and the fixtures
#   probscale          wqio.bootstrap
#   wqio               supplies the sources those tools compare against
# wqio is a dev-only dependency: this port reimplements the algorithms and does
# not import wqio at runtime.
dev = [
    "pytest>=7",
    "numpy",
    "pandas",
    "scipy",
    "probscale",
    "wqio>=0.7.2,<1.0",
]

[tool.maturin]
python-source = "python"
module-name = "polars_ros._internal"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "wqio: cross-validates against the installed wqio (needs the dev extra)",
]