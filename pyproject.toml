[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-ros"
# Sourced from Cargo.toml; this project deliberately keeps one version literal.
dynamic = ["version"]
description = "Regression on Order Statistics and bootstrap confidence intervals for Polars"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["polars>=1.0"]
authors = [{ name = "Paul Hobson" }]
maintainers = [{ name = "Paul Hobson" }]
keywords = ["polars", "ros", "censored-data", "bootstrap", "hydrology", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/phobson/polars-ros"
Repository = "https://github.com/phobson/polars-ros"
Issues = "https://github.com/phobson/polars-ros/issues"
Changelog = "https://github.com/phobson/polars-ros/blob/main/CHANGELOG.md"
# The reference implementation this port is validated against.
wqio = "https://github.com/International-BMP-Database/wqio"

[project.optional-dependencies]
# The scientific stack is needed only by the tools/ checkers, which cross-validate
# this port against the *installed* wqio. The regular test suite deliberately does
# not import wqio, so it stays installable without them.
#   numpy/pandas/scipy  wqio.ros and the fixtures
#   probscale          wqio.bootstrap
#   wqio               supplies the sources those tools compare against
# wqio is a dev-only dependency: this port reimplements the algorithms and does
# not import wqio at runtime.
dev = [
    "pytest>=7",
    "numpy",
    "pandas",
    "scipy",
    "probscale",
    "wqio>=0.7.2,<1.0",
]

[tool.maturin]
python-source = "python"
module-name = "polars_ros._internal"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "wqio: cross-validates against the installed wqio (needs the dev extra)",
]